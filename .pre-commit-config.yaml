repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^js/core/test/fixtures/robots/.*\.txt$ # real robots.txt snapshots, kept byte for byte
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^js/core/test/fixtures/robots/.*\.txt$
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^docs/superpowers/ # historical specs/plans: leave embedded snippets as written
      - id: ruff-format
        exclude: ^docs/superpowers/
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-jsonschema
        name: validate signals.json
        files: ^signals\.json$
        args: [--schemafile, signals.schema.json]
  - repo: local
    hooks:
      - id: mypy
        name: mypy (python/)
        entry: uv run --directory python mypy
        language: system
        pass_filenames: false
        files: ^python/src/
      - id: biome
        name: biome (js/)
        entry: pnpm --dir js run lint
        language: system
        pass_filenames: false
        files: ^js/
      - id: tsc
        name: tsc (js/)
        entry: pnpm --dir js run typecheck
        language: system
        pass_filenames: false
        files: ^(js/|signals\.json$)
