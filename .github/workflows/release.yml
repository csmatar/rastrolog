name: release

# Publishes to PyPI and npm on a v* tag via Trusted Publishing (OIDC). The build
# job runs both test suites and builds both packages with read-only rights; only
# the publish jobs can mint an OIDC token, and they run no project code. Each
# publish job waits for a maintainer's approval in its environment (`pypi`,
# `npm`), and both environments only accept v* tags.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read # default for every job; jobs below narrow or extend it explicitly

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish half-way

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false # no shared cache in the release path (cache-poisoning guard)
      - name: Tag matches package version
        working-directory: python
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          fi
      - name: Run test suite
        working-directory: python
        run: |
          uv sync --locked
          uv run pytest -q
      - name: Build
        working-directory: python
        run: uv build
      - name: Wheel contains signals.json
        working-directory: python
        run: python3 -m zipfile -l dist/*.whl | grep -q "rastrolog/signals.json"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no shared cache in the release path (cache-poisoning guard)
      - name: Tag matches npm package version
        run: |
          version="$(node -p "require('./js/snippet/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match npm package version v${version}"
            exit 1
          fi
      - name: Build and test the JS workspace
        working-directory: js
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run test
          pnpm run build
          pnpm --filter rastrolog run test:bundle
          pnpm --filter rastrolog run size
      - name: Pinned SRI tag in the READMEs matches this build
        working-directory: js
        run: pnpm --filter rastrolog run sri --check ../../README.md README.md
      - name: Pack the npm tarball
        working-directory: js/snippet
        run: pnpm pack --pack-destination ../../npm-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-dist
          path: npm-dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: python/dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rastrolog/
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC); nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  publish-npm:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/rastrolog
    permissions:
      id-token: write # npm trusted publishing (OIDC) and provenance; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist
          path: npm-dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # bundles npm 11 (trusted publishing needs >= 11.5.1)
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish the tarball built by the build job (no project code runs here)
        # The ./ matters: without it npm reads "npm-dist/x.tgz" as a GitHub
        # owner/repo shorthand and tries to fetch it over git (broke v0.2.0).
        run: npm publish ./npm-dist/rastrolog-*.tgz --provenance --access public --ignore-scripts
