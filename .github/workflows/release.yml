name: release

# Publishes to PyPI on a v* tag via Trusted Publishing (OIDC): no token is stored.
# The build job runs tests and builds with read-only rights; only the publish job
# can mint an OIDC token, and it runs no project code. The `pypi` environment
# requires a maintainer's approval and only accepts v* tags.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read # default for every job; jobs below narrow or extend it explicitly

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish half-way

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false # no shared cache in the release path (cache-poisoning guard)
      - name: Tag matches package version
        working-directory: python
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          fi
      - name: Run test suite
        working-directory: python
        run: |
          uv sync --locked
          uv run pytest -q
      - name: Build
        working-directory: python
        run: uv build
      - name: Wheel contains signals.json
        working-directory: python
        run: python3 -m zipfile -l dist/*.whl | grep -q "rastrolog/signals.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: python/dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rastrolog/
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC); nothing else
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
