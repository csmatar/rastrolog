name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # read-only token for every job

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=rastrolog --cov-report=term-missing --cov-fail-under=90

  package:
    name: wheel bundles signals.json (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build sdist and wheel (wheel is built from the sdist)
        working-directory: python
        run: uv build
      - name: Wheel contains signals.json
        working-directory: python
        run: python3 -m zipfile -l dist/*.whl | grep -q "rastrolog/signals.json"
      - name: Clean install runs the CLI and matches the golden report
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          uv venv --python "$PYTHON_VERSION" /tmp/clean
          uv pip install --python /tmp/clean/bin/python python/dist/*.whl
          /tmp/clean/bin/rastrolog parse conformance/logs/nginx.log --json > /tmp/report.json
          python3 - <<'EOF'
          import json, sys
          got = json.load(open("/tmp/report.json"))
          want = json.load(open("conformance/logs/nginx.expected.json"))
          sys.exit(0 if got == want else "installed wheel disagrees with golden report")
          EOF

  js:
    name: js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: js/package.json # pnpm version comes from "packageManager"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test # includes the TS conformance suite
      - run: pnpm run build
      - run: pnpm --filter rastrolog run test:bundle # forbidden APIs, published types
      - run: pnpm --filter rastrolog run size # ≤ 2 KB gzipped
      - name: npm and PyPI versions match
        run: |
          npm_version="$(node -p "require('./snippet/package.json').version")"
          py_version="$(grep -m1 '^version' ../python/pyproject.toml | cut -d'"' -f2)"
          if [ "${npm_version}" != "${py_version}" ]; then
            echo "js/snippet is ${npm_version} but python is ${py_version}; they ship from one tag"
            exit 1
          fi

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter rastrolog exec playwright install --with-deps chromium
      - run: pnpm --filter rastrolog run build
      - run: pnpm --filter rastrolog run e2e
